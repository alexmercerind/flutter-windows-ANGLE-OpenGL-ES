name: flutter_windows_angle_opengl_es
description: OpenGL ES rendering in Flutter Windows textures through ANGLE and D3D11 shared surfaces.
version: 1.1.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: FlutterWindowsAngleOpenglEsPluginCApi
