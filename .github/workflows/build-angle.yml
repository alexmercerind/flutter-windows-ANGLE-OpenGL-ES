name: Build ANGLE

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: angle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  preflight:
    name: Validate workflow and release tag
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.6"
      - name: Validate configured workflow versions
        shell: cmd
        run: python scripts\windows\angle.py validate-toolchain
      - name: Validate tag against lock file
        if: startsWith(github.ref, 'refs/tags/')
        shell: cmd
        run: python scripts\windows\angle.py validate-release "%GITHUB_REF_NAME%"

  build:
    name: Build ${{ matrix.architecture }}
    needs: preflight
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - x64
          - arm64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.6"
      - name: Validate configured and runner-resolved host tools
        shell: cmd
        run: python scripts\windows\angle.py validate-toolchain --runtime
      - name: Report runner-managed Windows toolchain inventory
        shell: pwsh
        run: |
          Write-Host "[1/4] Runner image"
          Write-Host "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Host "[2/4] Git"
          git --version
          Write-Host "[3/4] Visual Studio"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products * -format json
          Write-Host "[4/4] Installed Windows SDK include versions"
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" -Directory |
            Select-Object -ExpandProperty Name
      - name: Set up pinned ANGLE checkout
        shell: cmd
        run: python scripts\windows\angle.py setup
      - name: Build ANGLE
        shell: cmd
        run: python scripts\windows\angle.py build ${{ matrix.architecture }}
      - name: Collect artifacts
        shell: cmd
        run: python scripts\windows\angle.py collect ${{ matrix.architecture }}
      - name: Verify artifacts
        shell: cmd
        run: python scripts\windows\angle.py verify ${{ matrix.architecture }}
      - name: Build native smoke test
        shell: cmd
        run: python scripts\windows\angle.py smoke build ${{ matrix.architecture }}
      - name: Run x64 D3D11 and SwiftShader smoke tests
        if: matrix.architecture == 'x64'
        shell: cmd
        run: python scripts\windows\angle.py smoke run x64
      - name: Package x64
        if: matrix.architecture == 'x64'
        shell: cmd
        run: python scripts\windows\angle.py package x64
      - uses: subosito/flutter-action@v2.23.0
        if: matrix.architecture == 'x64'
        with:
          channel: stable
          flutter-version: "3.44.8"
      - name: Build Flutter x64 example
        if: matrix.architecture == 'x64'
        working-directory: example
        shell: cmd
        run: |
          call flutter --version
          call flutter pub get
          call flutter analyze
          call flutter build windows --release
          call python ..\scripts\windows\angle.py verify-flutter x64
      - name: Upload x64 release archive
        if: matrix.architecture == 'x64'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: angle-windows-x64
          path: dist/ANGLE-windows-x64.zip
          if-no-files-found: error
      - name: Upload ARM64 staging for native validation
        if: matrix.architecture == 'arm64'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: angle-windows-arm64-staging
          path: |
            .angle-work/staging/arm64
            .angle-work/smoke/arm64/Release/angle_smoke_test.exe
            .angle-work/smoke/arm64/smoke-build-report.json
            .angle-work/out/arm64/build-report.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Verify repository binaries match build staging
        shell: cmd
        run: >-
          python scripts\windows\angle.py verify-repository
          ${{ matrix.architecture }}
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: angle-${{ matrix.architecture }}-reports
          path: |
            .angle-work/out/${{ matrix.architecture }}/args.gn
            .angle-work/out/${{ matrix.architecture }}/gn-args-list.txt
            .angle-work/out/${{ matrix.architecture }}/build-report.json
            .angle-work/staging/${{ matrix.architecture }}/*-report.json
            .angle-work/flutter-${{ matrix.architecture }}-report.json
            .angle-work/logs/build-${{ matrix.architecture }}.log
          include-hidden-files: true
          if-no-files-found: warn

  arm64-native-smoke:
    name: ARM64 native smoke and package
    if: needs.build.result == 'success'
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.6"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: angle-windows-arm64-staging
          path: .angle-work
      - name: Run native ARM64 D3D11 and SwiftShader smoke tests
        shell: cmd
        run: >-
          python scripts\windows\angle.py smoke run arm64
          --staging .angle-work\staging\arm64
          --executable .angle-work\smoke\arm64\Release\angle_smoke_test.exe
      - name: Package ARM64
        shell: cmd
        run: python scripts\windows\angle.py package arm64
      - name: Upload ARM64 release archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: angle-windows-arm64
          path: dist/ANGLE-windows-arm64.zip
          if-no-files-found: error
      - uses: subosito/flutter-action@v2.23.0
        id: flutter-arm64
        with:
          channel: stable
          flutter-version: "3.44.8"
          architecture: x64
      - name: Switch Flutter SDK to native ARM64 Dart
        id: flutter-arm64-dart
        shell: pwsh
        run: |
          $flutterRoot = $env:FLUTTER_ROOT
          if (-not $flutterRoot) {
            throw "FLUTTER_ROOT was not set by flutter-action."
          }
          Write-Host "[1/3] Remove the x64 Dart SDK stamp"
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Remove-Item -LiteralPath `
            (Join-Path $flutterRoot "bin\cache\engine-dart-sdk.stamp") `
            -Force -ErrorAction SilentlyContinue
          Write-Host "[2/3] Download the native ARM64 Dart SDK"
          & (Join-Path $flutterRoot "bin\internal\update_dart_sdk.ps1")
          Write-Host "[3/3] Verify the Dart VM architecture"
          $dartVersion = & (Join-Path $flutterRoot "bin\dart.bat") `
            --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "Dart architecture query failed with $LASTEXITCODE."
          }
          Write-Host $dartVersion
          if ($dartVersion -notmatch "windows_arm64") {
            throw "Expected native windows_arm64 Dart, got: $dartVersion"
          }
      - name: Precache Flutter Windows ARM64 engine artifacts
        id: flutter-arm64-precache
        shell: pwsh
        run: |
          flutter --version
          if ($LASTEXITCODE -ne 0) {
            throw "flutter --version failed with $LASTEXITCODE."
          }
          flutter doctor -v
          if ($LASTEXITCODE -ne 0) {
            throw "flutter doctor failed with $LASTEXITCODE."
          }
          flutter precache --windows
          if ($LASTEXITCODE -ne 0) {
            throw "flutter precache failed with $LASTEXITCODE."
          }
          $engineRoot = Join-Path `
            $env:FLUTTER_ROOT "bin\cache\artifacts\engine"
          Write-Host "Engine artifacts:"
          Get-ChildItem -LiteralPath $engineRoot -Directory |
            Select-Object -ExpandProperty Name
          if (-not (Test-Path -LiteralPath `
              (Join-Path $engineRoot "windows-arm64-release"))) {
            throw "Flutter did not provide windows-arm64-release artifacts."
          }
      - name: Build Flutter ARM64 example
        id: flutter-arm64-build
        working-directory: example
        shell: cmd
        run: |
          call flutter pub get
          call flutter analyze
          call flutter build windows --release
          call python ..\scripts\windows\angle.py verify-flutter arm64 ^
            --report ..\.angle-work\staging\arm64\flutter-arm64-pe-report.json
      - name: Record Flutter ARM64 support result
        if: always()
        shell: pwsh
        run: |
          $setupOutcome = '${{ steps.flutter-arm64.outcome }}'
          $dartOutcome = '${{ steps.flutter-arm64-dart.outcome }}'
          $precacheOutcome = '${{ steps.flutter-arm64-precache.outcome }}'
          $buildOutcome = '${{ steps.flutter-arm64-build.outcome }}'
          if ($setupOutcome -ne 'success') {
            $blocker = "x64 Flutter 3.44.8 setup failed on windows-11-arm."
          } elseif ($dartOutcome -ne 'success') {
            $blocker = "Flutter 3.44.8 native ARM64 Dart bootstrap failed."
          } elseif ($precacheOutcome -ne 'success') {
            $blocker = "Flutter 3.44.8 Windows precache failed on windows-11-arm."
          } elseif ($buildOutcome -ne 'success') {
            $blocker = "Flutter 3.44.8 did not produce verified ARM64 Windows PE outputs."
          } else {
            $blocker = "none"
          }
          @(
            "flutter_setup_outcome=$setupOutcome"
            "flutter_arm64_dart_outcome=$dartOutcome"
            "flutter_precache_outcome=$precacheOutcome"
            "flutter_arm64_build_outcome=$buildOutcome"
            "external_blocker=$blocker"
          ) | Set-Content -LiteralPath `
            .angle-work\staging\arm64\flutter-arm64-report.txt `
            -Encoding utf8
      - name: Upload ARM64 native reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: angle-arm64-native-reports
          path: |
            .angle-work/staging/arm64/*-report.json
            .angle-work/staging/arm64/flutter-arm64-report.txt
          if-no-files-found: warn

  checksums:
    name: Verify archives and create checksums
    needs:
      - build
      - arm64-native-smoke
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.6"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: angle-windows-x64
          path: dist
      - uses: actions/download-artifact@v8.0.1
        with:
          name: angle-windows-arm64
          path: dist
      - name: Create SHA256SUMS.txt
        shell: cmd
        run: python scripts\windows\angle.py checksums
      - name: Independently validate both release ZIP archives
        shell: cmd
        run: python scripts\windows\angle.py validate-archives --require-checksums
      - name: Upload archive validation report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: angle-release-validation-report
          path: .angle-work/archive-validation-report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: angle-release-files
          path: |
            dist/ANGLE-windows-x64.zip
            dist/ANGLE-windows-arm64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - preflight
      - checksums
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: angle-release-files
          path: dist
      - name: Publish release files
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "%GITHUB_REF_NAME%"
          dist\ANGLE-windows-x64.zip
          dist\ANGLE-windows-arm64.zip
          dist\SHA256SUMS.txt
          --repo "%GITHUB_REPOSITORY%"
          --verify-tag
          --title "%GITHUB_REF_NAME%"
